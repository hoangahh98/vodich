name: Keep Render Alive

on:
  schedule:
    # Chạy mỗi 10 phút, từ 8h sáng đến 23h đêm (giờ Việt Nam)
    - cron: '*/10 1-16 * * *'
  workflow_dispatch:

jobs:
  ping-website:
    runs-on: ubuntu-latest
    steps:
      - name: Send HTTP request with 5-minute timeout
        uses: fjogeleit/http-request-action@v1
        with:
          url: 'https://pickleball-1-hsk7.onrender.com/healthz'
          method: 'GET'
          timeout: 300000
