name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      # Có DB thật thì bộ e2e phân quyền (e2e/permissions.spec.js, e2e/db.spec.js) mới chạy;
      # thiếu biến này chúng tự skip và CI xanh giả — đúng thứ cần tránh nhất.
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      SESSION_SECRET: ci-session-secret
      REQUIRE_REDIS: "false"

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security audit (không chặn build)
        run: npm audit --audit-level=high
        continue-on-error: true

      # CỐ Ý dùng `db push` chứ không phải `migrate deploy`.
      #
      # Chuỗi migration hiện tại KHÔNG dựng được schema từ DB trống: migration đầu tiên
      # (20260702000000_add_tournament_end_time) đã là ALTER TABLE trên bảng `tournament`
      # mà không migration nào tạo ra — schema gốc được tạo tay/`db push` từ trước khi
      # migration ra đời. `migrate deploy` trên DB trống sẽ chết ngay ở bước đầu.
      #
      # Với DB test dùng một lần thì `db push` là đúng bài (Prisma cũng khuyến nghị vậy):
      # dựng thẳng schema từ schema.prisma, không cần lịch sử migration.
      #
      # ⚠️ Điều này KHÔNG khắc phục được vấn đề gốc: hiện chưa dựng lại được DB từ đầu
      # nếu Supabase mất. Xem README phần "Khôi phục từ số không".
      - name: Dựng schema cho DB test
        run: npx prisma db push --skip-generate

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Unit tests
        run: npm test

      - name: Browser + permission e2e tests
        run: npm run test:e2e

      # Bộ e2e phân quyền tự skip khi thiếu DB. Bước này bắt lỗi cấu hình đó,
      # tránh tình huống test bảo mật im lặng không chạy mà CI vẫn báo xanh.
      - name: Xác nhận e2e phân quyền THẬT SỰ đã chạy
        run: node scripts/assert-e2e-permissions-ran.js
